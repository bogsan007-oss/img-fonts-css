name: Fetch Crime News RSS

on:
  schedule:
    - cron: '0 * * * *'   # каждый час
  workflow_dispatch:       # можно запустить вручную

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch RSS
        run: |
          curl -sL "https://www.interfax.ru/rss.asp" -o crime-news.xml
          # Проверяем, что это XML, а не HTML-ошибка
          if ! grep -q "<rss" crime-news.xml; then
            echo "RSS не получен, оставляем старый файл"
            exit 0
          fi
          echo "RSS обновлён: $(date)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crime-news.xml
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Update crime news RSS ($(date +'%Y-%m-%d %H:%M'))"
            git push
          fi
