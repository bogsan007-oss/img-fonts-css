name: Fetch Crime News RSS

on:
  schedule:
    - cron: '0 * * * *' # Обновление каждый час
  workflow_dispatch: # Возможность запустить вручную

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch RSS
        uses: Promptly-Technologies-LLC/rss-fetch-action@v1
        with:
          feed_url: 'https://www.interfax.ru/rss.asp'
          file_path: 'crime-news.xml'

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Update crime news RSS'
          file_pattern: 'crime-news.xml'
